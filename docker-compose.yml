services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    environment:
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-tls}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASS: "${SMTP_PASS}"
      MAIL_FROM: "${MAIL_FROM}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-Site Daniel Guedes}"
      MAIL_TO: "${MAIL_TO}"
      MAIL_TO_NAME: "${MAIL_TO_NAME:-Daniel Guedes}"
